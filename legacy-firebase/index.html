<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartPark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="login-page">
    <div class="login-illustration">
      <div class="floating-elements">
        <i class="fas fa-car-side"></i>
        <i class="fas fa-parking"></i>
        <i class="fas fa-ticket-alt"></i>
        <i class="fas fa-shield-alt"></i>
      </div>
      <h2 class="fade-in-up delay-1">Smart Parking Management</h2>
      <p class="fade-in-up delay-2">Streamline your parking operations with real-time allocation, automated billing, and secure access control.</p>
    </div>
    
    <div class="login-form-container">
      <div class="auth-card">
        <div class="auth-header fade-in-up">
          <div class="auth-logo">
            <i class="fas fa-car-side"></i>
          </div>
          <h1>Welcome to SmartPark</h1>
          <p>Please log in to your account</p>
        </div>

        <!-- Login Form -->
        <div id="loginSection" class="auth-form active fade-in-up delay-1">
          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email Address</label>
              <input type="email" id="loginEmail" class="input" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <div class="password-input">
                <input type="password" id="loginPassword" class="input" placeholder="••••••••" required>
                <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
          </form>
          <div class="auth-switch">
            <a href="#" id="forgotPassword">Forgot password?</a>
          </div>
          <div class="auth-switch">
            Don't have an account? <a href="#" id="showRegister">Register</a>
          </div>
        </div>

        <!-- Register Form -->
        <div id="registerSection" class="auth-form">
          <form id="registerForm">
            <div class="form-group">
              <label for="regName">Full Name</label>
              <input type="text" id="regName" class="input" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label for="regEmail">Email Address</label>
              <input type="email" id="regEmail" class="input" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
              <label for="regPassword">Password</label>
              <div class="password-input">
                <input type="password" id="regPassword" class="input" placeholder="••••••••" required>
                <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <div class="form-group">
              <label for="regConfirmPassword">Confirm Password</label>
              <div class="password-input">
                <input type="password" id="regConfirmPassword" class="input" placeholder="••••••••" required>
                <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
          </form>
          <div class="auth-switch">
            Already have an account? <a href="#" id="showLogin">Login</a>
          </div>
        </div>
        
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
