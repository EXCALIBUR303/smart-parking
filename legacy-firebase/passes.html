<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passes - SmartPark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-car-side"></i>
        <span>SmartPark</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" data-page="dashboard">
        <i class="fas fa-chart-pie"></i><span>Dashboard</span>
      </a>
      <a href="slots.html" class="nav-link" data-page="slots">
        <i class="fas fa-th-large"></i><span>Parking Slots</span>
      </a>
      <a href="gate.html" class="nav-link" data-page="gate">
        <i class="fas fa-dungeon"></i><span>Gate Entry/Exit</span>
      </a>
      <a href="reservations.html" class="nav-link" data-page="reservations">
        <i class="fas fa-calendar-check"></i><span>Reservations</span>
      </a>
      <a href="passes.html" class="nav-link active" data-page="passes">
        <i class="fas fa-id-card"></i><span>Passes</span>
      </a>
      <a href="billing.html" class="nav-link" data-page="billing">
        <i class="fas fa-file-invoice-dollar"></i><span>Billing</span>
      </a>
      <a href="reports.html" class="nav-link" data-page="reports">
        <i class="fas fa-chart-bar"></i><span>Reports</span>
      </a>
      <a href="customers.html" class="nav-link" data-page="customers">
        <i class="fas fa-users"></i><span>Customers</span>
      </a>
      <a href="settings.html" class="nav-link" data-page="settings">
        <i class="fas fa-cog"></i><span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i><span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </button>
      <div class="header-title">
        <h1>Parking Passes</h1>
        <p class="header-subtitle">Manage customer parking passes</p>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search passes...">
        </div>
        <div class="user-profile">
          <div class="avatar">
            <i class="fas fa-user"></i>
          </div>
          <span class="user-name" id="userName">Admin</span>
        </div>
      </div>
    </header>

    <div class="page-content">
      <!-- Top Action Bar -->
      <div class="action-bar">
        <div class="filter-controls">
          <select id="passTypeFilter" class="form-control">
            <option value="all">All Types</option>
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
            <option value="Annual">Annual</option>
          </select>
          <select id="passStatusFilter" class="form-control">
            <option value="all">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Expired">Expired</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnNewPass">
          <i class="fas fa-plus"></i> Issue New Pass
        </button>
      </div>

      <!-- Stats Strip -->
      <div class="stats-strip grid-4">
        <div class="stat-box">
          <h3>Active Passes</h3>
          <p class="stat-value" id="statActivePasses">0</p>
        </div>
        <div class="stat-box">
          <h3>Expiring Soon</h3>
          <p class="stat-value" id="statExpiringPasses">0</p>
        </div>
        <div class="stat-box">
          <h3>Expired</h3>
          <p class="stat-value" id="statExpiredPasses">0</p>
        </div>
        <div class="stat-box">
          <h3>Total Revenue</h3>
          <p class="stat-value" id="statPassRevenue">₹0</p>
        </div>
      </div>

      <!-- Passes Grid -->
      <div id="passesList" class="passes-grid">
        <!-- Filled via JS -->
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-id-card-alt"></i>
        <p>No passes found</p>
      </div>
    </div>
  </main>

  <!-- Issue New Pass Modal -->
  <div id="newPassModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Issue New Pass</h2>
        <span class="close-modal" id="closePassModal">&times;</span>
      </div>
      <div class="modal-body">
        <form id="passForm">
          <div class="form-group">
            <label>Customer</label>
            <input type="text" id="passCustomerSearch" class="form-control" placeholder="Search customer by name or phone" autocomplete="off" required>
            <input type="hidden" id="passCustomerId">
          </div>
          <div class="form-group">
            <label>Vehicle Plate</label>
            <input type="text" id="passVehiclePlate" class="form-control" required>
          </div>
          
          <div class="form-group">
            <label>Pass Type</label>
            <div class="radio-cards" id="passTypeSelection">
              <label class="radio-card">
                <input type="radio" name="passType" value="Daily" required>
                <div class="card-content">
                  <h4>Daily</h4>
                  <p>₹100</p>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="passType" value="Weekly">
                <div class="card-content">
                  <h4>Weekly</h4>
                  <p>₹500</p>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="passType" value="Monthly">
                <div class="card-content">
                  <h4>Monthly</h4>
                  <p>₹1500</p>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="passType" value="Annual">
                <div class="card-content">
                  <h4>Annual</h4>
                  <p>₹12000</p>
                </div>
              </label>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Valid From</label>
              <input type="date" id="passValidFrom" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Valid Until</label>
              <input type="date" id="passValidUntil" class="form-control" required readonly>
            </div>
          </div>
          <div class="form-group">
            <label>Facility (Optional)</label>
            <select id="passFacility" class="form-control">
              <option value="All">All Facilities</option>
            </select>
          </div>
          <div class="price-display">
            <span>Total Amount:</span>
            <span id="passPriceDisplay">₹0</span>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btnCancelPass">Cancel</button>
            <button type="submit" class="btn btn-primary">Issue Pass</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="passDetailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Pass Details</h2>
        <span class="close-modal" id="closePassDetailModal">&times;</span>
      </div>
      <div class="modal-body" id="passDetailBody">
        <!-- Filled via JS -->
      </div>
    </div>
  </div>

  <script type="module" src="js/passes.js"></script>
</body>
</html>
